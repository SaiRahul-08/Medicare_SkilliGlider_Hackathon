<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - MediCare+</title>

    <!-- CSS -->

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <!-- FONT AWESOME -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(135deg, #2563eb, #1e3a8a, #0f172a);

        overflow: hidden;

        position: relative;

        padding: 20px;
      }

      /* BACKGROUND CIRCLES */

      .background-circle {
        position: absolute;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(10px);
      }

      .circle1 {
        width: 320px;
        height: 320px;

        top: -100px;
        left: -100px;
      }

      .circle2 {
        width: 280px;
        height: 280px;

        bottom: -100px;
        right: -100px;
      }

      /* LOGIN CARD */

      .login-container {
        width: 100%;
        max-width: 430px;

        background: rgba(255, 255, 255, 0.12);

        border: 1px solid rgba(255, 255, 255, 0.18);

        backdrop-filter: blur(20px);

        border-radius: 28px;

        padding: 45px 38px;

        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);

        color: white;

        position: relative;

        z-index: 10;

        animation: fadeIn 0.7s ease;
      }

      /* LOGO */

      .logo {
        text-align: center;

        margin-bottom: 12px;
      }

      .logo i {
        font-size: 60px;

        margin-bottom: 12px;
      }

      .logo h1 {
        font-size: 52px;

        font-weight: 800;

        letter-spacing: 1px;
      }

      /* SUBTITLE */

      .subtitle {
        text-align: center;

        margin-bottom: 38px;

        color: #dbeafe;

        font-size: 17px;

        line-height: 1.6;
      }

      /* FORM */

      form {
        display: flex;

        flex-direction: column;

        gap: 22px;
      }

      /* INPUT BOX */

      .input-box {
        position: relative;
      }

      .input-box i {
        position: absolute;

        left: 18px;
        top: 20px;

        color: #94a3b8;

        font-size: 17px;
      }

      .input-box input {
        width: 100%;

        height: 60px;

        border: none;

        outline: none;

        border-radius: 16px;

        padding-left: 52px;

        padding-right: 18px;

        font-size: 16px;

        background: rgba(255, 255, 255, 0.9);

        color: #0f172a;

        transition: 0.3s;
      }

      .input-box input::placeholder {
        color: #64748b;
      }

      .input-box input:focus {
        transform: scale(1.02);

        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
      }

      /* BUTTON */

      .login-btn {
        width: 100%;

        height: 60px;

        border: none;

        border-radius: 16px;

        background: white;

        color: #2563eb;

        font-size: 19px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.3s;
      }

      .login-btn:hover {
        transform: translateY(-3px);

        background: #eff6ff;
      }

      /* SIGNUP */

      .signup-text {
        text-align: center;

        margin-top: 28px;

        color: #e2e8f0;

        font-size: 16px;
      }

      .signup-text a {
        color: white;

        text-decoration: none;

        font-weight: 700;
      }

      .signup-text a:hover {
        text-decoration: underline;
      }

      /* FLASH MESSAGE */

      .flash-message {
        position: fixed;

        top: 30px;
        right: 30px;

        min-width: 320px;

        padding: 16px 22px;

        border-radius: 14px;

        font-size: 16px;

        font-weight: 600;

        z-index: 9999;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);

        animation: slideIn 0.5s ease;
      }

      .flash-message.success {
        background: #dcfce7;

        color: #166534;

        border-left: 6px solid #16a34a;
      }

      .flash-message.error {
        background: #fee2e2;

        color: #991b1b;

        border-left: 6px solid #dc2626;
      }

      /* ANIMATIONS */

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(40px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(100px);
        }

        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
          transform: translateX(100px);
        }
      }

      /* MOBILE */

      @media (max-width: 500px) {
        .login-container {
          padding: 35px 25px;
        }

        .logo h1 {
          font-size: 42px;
        }

        .subtitle {
          font-size: 15px;
        }

        .flash-message {
          right: 15px;
          left: 15px;

          min-width: auto;
        }
      }
    </style>
  </head>

  <body>
    <!-- BACKGROUND -->

    <div class="background-circle circle1"></div>

    <div class="background-circle circle2"></div>

    <!-- FLASH MESSAGE -->

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %} {% for category, message in messages %}

    <div class="flash-message {{ category }}">{{ message }}</div>

    {% endfor %} {% endif %} {% endwith %}

    <!-- LOGIN CARD -->

    <div class="login-container">
      <!-- LOGO -->

      <div class="logo">
        <i class="fa-solid fa-heart-pulse"></i>

        <h1>MediCare+</h1>
      </div>

      <!-- SUBTITLE -->

      <p class="subtitle">Smart Medicine Reminder & Health Tracker</p>

      <!-- FORM -->

      <form method="POST">
        <!-- USERNAME -->

        <div class="input-box">
          <i class="fa-solid fa-user"></i>

          <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
          />
        </div>

        <!-- PASSWORD -->

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
          />
        </div>

        <!-- BUTTON -->

        <button type="submit" class="login-btn">
          <i class="fa-solid fa-right-to-bracket"></i>

          Login
        </button>
      </form>

      <!-- SIGNUP -->

      <div class="signup-text">
        Don't have an account?

        <a href="/signup"> Signup </a>
      </div>
    </div>

    <!-- AUTO HIDE FLASH -->

    <script>
      setTimeout(() => {
        const flash = document.querySelector(".flash-message");

        if (flash) {
          flash.style.animation = "fadeOut 0.5s ease forwards";

          setTimeout(() => {
            flash.remove();
          }, 500);
        }
      }, 10000);
    </script>
  </body>
</html>
