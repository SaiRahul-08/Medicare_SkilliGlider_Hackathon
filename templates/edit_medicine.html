{% extends 'base.html' %} {% block content %}

<div class="form-container">
  <form method="POST" class="medicine-form">
    <h1 class="heading">
      <i class="fa-solid fa-pen-to-square"></i>
      Edit Medicine
    </h1>

    <!-- MEDICINE NAME -->

    <div class="input-group">
      <label>Medicine Name</label>

      <input type="text" name="name" value="{{ medicine.name }}" required />
    </div>

    <!-- DOSAGE -->

    <div class="input-group">
      <label>Dosage</label>

      <input type="text" name="dosage" value="{{ medicine.dosage }}" required />
    </div>

    <!-- MEDICINE TIME -->

    <div class="input-group">
      <label class="time-label"> Medicine Time </label>

      <div class="time-picker-group">
        <!-- HOUR -->

        <select name="hour" required class="time-select">
          <option selected>{{ medicine.hour }}</option>

          <option>01</option>
          <option>02</option>
          <option>03</option>
          <option>04</option>
          <option>05</option>
          <option>06</option>
          <option>07</option>
          <option>08</option>
          <option>09</option>
          <option>10</option>
          <option>11</option>
          <option>12</option>
        </select>

        <!-- MINUTE -->

        <select name="minute" required class="time-select">
          <option selected>{{ medicine.minute }}</option>

          <option>00</option>
          <option>05</option>
          <option>10</option>
          <option>15</option>
          <option>20</option>
          <option>25</option>
          <option>30</option>
          <option>35</option>
          <option>40</option>
          <option>45</option>
          <option>50</option>
          <option>55</option>
        </select>

        <!-- PERIOD -->

        <select name="period" required class="time-select period-select">
          <option selected>{{ medicine.period }}</option>

          <option>AM</option>
          <option>PM</option>
        </select>
      </div>

      <small class="helper-text">
        Alarm will ring 5 minutes before medicine time
      </small>
    </div>

    <!-- STOCK -->

    <div class="input-group">
      <label>Stock Quantity</label>

      <input
        type="number"
        name="stock"
        value="{{ medicine.stock }}"
        min="1"
        required
      />
    </div>

    <!-- BUTTON -->

    <button type="submit" class="btn">
      <i class="fa-solid fa-floppy-disk"></i>

      Update Medicine
    </button>
  </form>
</div>

{% endblock %}
